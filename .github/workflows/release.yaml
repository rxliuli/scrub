env:
  DIRECTORY: .

name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check version change
        id: version
        uses: rxliuli/version-check@v1
        with:
          file: ${{ env.DIRECTORY }}/package.json

  release:
    permissions:
      contents: write
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      - name: Read package name
        id: pkg
        run: echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Zip extensions
        run: |
          cd ${{ env.DIRECTORY }}
          pnpm zip
          pnpm zip:firefox

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'v${{ needs.version.outputs.version }}'
          name: 'v${{ needs.version.outputs.version }}'
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ env.DIRECTORY }}/.output/${{ steps.pkg.outputs.name }}-${{ needs.version.outputs.version }}-chrome.zip
            ${{ env.DIRECTORY }}/.output/${{ steps.pkg.outputs.name }}-${{ needs.version.outputs.version }}-firefox.zip
            ${{ env.DIRECTORY }}/.output/${{ steps.pkg.outputs.name }}-${{ needs.version.outputs.version }}-sources.zip

      - name: Push to Chrome Web Store
        uses: extport-dev/actions/push@v1
        with:
          file: ${{ env.DIRECTORY }}/.output/${{ steps.pkg.outputs.name }}-${{ needs.version.outputs.version }}-chrome.zip
          version: ${{ needs.version.outputs.version }}
          store: chrome
          api-key: ${{ secrets.EXTPORT_API_KEY }}

      - name: Push to Edge Add-ons
        uses: extport-dev/actions/push@v1
        with:
          # Edge is Chromium-based — it reuses the same chrome build, same as
          # the old commented-out `wxt submit --edge-zip ...-chrome.zip` step did.
          file: ${{ env.DIRECTORY }}/.output/${{ steps.pkg.outputs.name }}-${{ needs.version.outputs.version }}-chrome.zip
          version: ${{ needs.version.outputs.version }}
          store: edge
          api-key: ${{ secrets.EXTPORT_API_KEY }}

      - name: Push to Firefox AMO
        uses: extport-dev/actions/push@v1
        with:
          file: ${{ env.DIRECTORY }}/.output/${{ steps.pkg.outputs.name }}-${{ needs.version.outputs.version }}-firefox.zip
          source-zip: ${{ env.DIRECTORY }}/.output/${{ steps.pkg.outputs.name }}-${{ needs.version.outputs.version }}-sources.zip
          version: ${{ needs.version.outputs.version }}
          store: firefox
          api-key: ${{ secrets.EXTPORT_API_KEY }}

  safari:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install

      - name: Build Safari extension
        run: pnpm build:safari

      - uses: extport-dev/actions/safari-build@v1
        with:
          project-path: '${{ env.DIRECTORY }}/.output/Scrub - Clear Site Data'
          team-id: N2X78TUUFG
          issuer-id: ${{ secrets.APPLE_API_ISSUER }}
          key-id: ${{ secrets.APPLE_API_KEY_ID }}
          key-base64: ${{ secrets.APPLE_API_KEY }}
          version: ${{ needs.version.outputs.version }}

      - name: Register the Safari version with extport
        uses: extport-dev/actions/push@v1
        with:
          version: ${{ needs.version.outputs.version }}
          store: safari
          api-key: ${{ secrets.EXTPORT_API_KEY }}
