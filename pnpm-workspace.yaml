# pnpm 12 no longer reads the `pnpm` field in package.json — settings live
# here now (https://pnpm.io/settings).

# pnpm blocks dependency lifecycle scripts unless they are approved here
# (`pnpm approve-builds` writes this block).
allowBuilds:
  esbuild: true
overrides:
  publish-browser-extension: file:./vendor/publish-browser-extension-6.2.0.tgz
minimumReleaseAgeExclude:
  - '@vitest/browser-playwright@5.1.1'
  - '@vitest/browser@5.1.1'
  - '@vitest/mocker@5.1.1'
  - '@vitest/pretty-format@5.1.1'
  - '@vitest/spy@5.1.1'
  - '@vitest/ui@5.1.1'
  - '@vitest/utils@5.1.1'
  - vitest@5.1.1
