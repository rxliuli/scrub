name: Safari Demo (Official WXT + publish-browser-extension)

on:
  push:
    branches: [demo/wxt-safari-official]

jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Safari extension (WXT built-in Safari module)
        run: pnpm build:safari

      - name: Upload Safari builds via wxt submit (--safari-skip-submit-review)
        env:
          SAFARI_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          SAFARI_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SAFARI_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY }}
          SAFARI_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          SAFARI_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: pnpm exec wxt submit --safari-project-path ".output/Scrub - Clear Site Data" --safari-skip-submit-review
